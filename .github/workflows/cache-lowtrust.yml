name: cache-lowtrust
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["cache-probe"]
    types: [completed]
permissions:
  contents: read
jobs:
  lowtrust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/github-script@v7
        env:
          PROBE_PLAN: ${{ vars.LOWTRUST_PLAN }}
          PROBE_LABEL: lowtrust-${{ github.event_name }}
        with:
          script: |
            const probe = require(`${process.env.GITHUB_WORKSPACE}/.github/probe/cache-probe.js`)
            await probe({core})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lowtrust-${{ github.event_name }}-${{ github.run_id }}
          path: probe-results-*.json
          if-no-files-found: warn
