name: wr-child
on:
  workflow_run:
    workflows: ["cache-lowtrust", "pr-parent"]
    types: [completed]
permissions:
  contents: read
jobs:
  wrchild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          PROBE_PLAN: ${{ vars.LOWTRUST_PLAN }}
          PROBE_LABEL: wr-child-parent-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.name }}
        with:
          script: |
            const probe = require(`${process.env.GITHUB_WORKSPACE}/.github/probe/cache-probe.js`)
            await probe({core})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrchild-${{ github.event.workflow_run.event }}-${{ github.run_id }}
          path: probe-results-*.json
          if-no-files-found: warn
